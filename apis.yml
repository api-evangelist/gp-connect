- aid: gp-connect:access-document-fhir
  name: GP Connect Access Document FHIR API
  tags:
  - FHIR STU3
  - Patient Records
  - Documents
  - Unstructured Records
  - Clinical Access
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://sandbox.api.service.nhs.uk/gp-connect-access-document-fhir
  humanURL: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-document-fhir
  description: >-
    Retrieve unstructured documents (e.g. scanned letters, attachments) from a patient's GP practice record.
    Complements the structured access API for cases where clinical information is held as binary document
    rather than coded FHIR resources. Mediated through the Spine Security Proxy over HSCN.
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/gp-connect-access-document-fhir
- aid: gp-connect:send-document-fhir
  name: GP Connect Send Document FHIR API
  tags:
  - FHIR STU3
  - ITK3
  - Mesh
  - Documents
  - Messaging
  - Clinical Access
  tags_raw:
  - FHIR STU3
  - ITK3
  - MESH
  - Documents
  - Messaging
  - Clinical Access
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  baseURL: https://digital.nhs.uk/developer/api-catalogue/gp-connect-send-document-fhir
  humanURL: https://digital.nhs.uk/developer/api-catalogue/gp-connect-send-document-fhir
  description: >-
    Send a PDF consultation summary or clinical document to a patient's registered GP practice. Used when
    a patient is seen in a non-GP setting (out-of-hours, community pharmacy, urgent care centre) and the
    consulting clinician needs to update the patient's GP record. Messages use FHIR STU3 ITK3 composition
    payloads delivered via MESH messaging infrastructure. In production.
  properties:
  - type: Documentation
    url: https://digital.nhs.uk/developer/api-catalogue/gp-connect-send-document-fhir
