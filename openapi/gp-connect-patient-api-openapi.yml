openapi: 3.2.0
info:
  title: Gp Connect Patient API
  version: Computed and injected at build time by `scripts/set_version.py`
  description: 'Operations tagged Patient across 3 of this provider''s published API definitions: gp-connect-appointments-management-fhir.yaml, gp-connect-patient-facing-access-record-fhir.yaml, gp-connect-patient-facing-prescriptions-management-fhir.yaml. Each path carries the servers of the definition it was published in.'
servers:
- description: Sandbox environment.
  url: https://sandbox.api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
- description: Integration test environment.
  url: https://int.api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
- description: Production environment.
  url: https://api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
- url: https://sandbox.api.service.nhs.uk/gp-connect/patient-facing/access-record-fhir/FHIR/STU3/
  description: Sandbox environment.
- url: https://int.api.service.nhs.uk/gp-connect/patient-facing/access-record-fhir/FHIR/STU3/
  description: Integration test environment.
- url: https://api.service.nhs.uk/gp-connect/patient-facing/access-record-fhir/FHIR/STU3/
  description: Production environment.
- url: https://sandbox.api.service.nhs.uk/gp-connect/patient-facing/prescriptions-management-fhir/FHIR/R4
  description: Sandbox environment.
- url: https://int.api.service.nhs.uk/gp-connect/patient-facing/prescriptions-management-fhir/FHIR/R4
  description: Integration test environment.
- url: https://api.service.nhs.uk/gp-connect/patient-facing/prescriptions-management-fhir/FHIR/R4
  description: Production environment.
tags:
- name: Patient
paths:
  /Patient/{id}/Appointment:
    get:
      summary: Read a patient's appointments
      description: Retrieve all appointments for the patient within a defined time-frame.
      parameters:
      - $ref: '#/components/parameters/BearerAuthorization'
      - $ref: '#/components/parameters/CorrelationID'
      - $ref: '#/components/parameters/RequestID'
      - name: id
        in: path
        description: The patient's NHS number. The primary identifier of a patient, unique within NHS England and Wales. Always 10 digits and must be a [valid NHS number](https://www.datadictionary.nhs.uk/attributes/nhs_number.html).
        required: true
        schema:
          type: string
        example: '9000000009'
      - name: start
        in: query
        description: Appointment start/end dates. Default values show a query for appointments on or after 2020-05-09 and on or before 2020-05-19.
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
          default:
          - ge2020-05-09
          - le2020-05-19
      - in: query
        name: _include:recurse
        description: 'Appointment:actor:Practitioner Include Practitioner resources referenced in Appointment:actor

          Appointment:actor:Location Include Location resources referenced in Appointment:actor

          '
        schema:
          type: array
          items:
            type: string
            enum:
            - Appointment:actor:Practitioner
            - Appointment:actor:Location
      - name: past-appt-limit
        in: query
        description: Number of past appointments to return in query, starting at the date given in the "le" portion of the start parameter and working backwards. Parameter is optional, if no value supplied then no limits are applied.
        required: false
        schema:
          type: string
          example: '5'
      - name: status
        in: query
        description: 'The type of status to search: you can find valid values [here](https://simplifier.net/packages/hl7.fhir.r4.core/4.0.1/files/83480)

          '
        required: false
        schema:
          type: string
          example: proposed
      responses:
        200:
          description: OK
          content:
            application/fhir+json:
              schema:
                type: object
                description: Link to Profile--GPConnect-Appointment-1 resource population guidance [here](https://simplifier.net/guide/gpconnect-data-model/Home/FHIR-Assets/All-assets/Profiles/Profile--GPConnect-Appointment-1?version=current).
              examples:
                example:
                  $ref: components/examples/PatientAppointment.yaml
        4XX:
          description: 'An error occurred as follows:



            | HTTP status | Error code               | Description                                                        |

            | ----------- | ----------               | -----------                                                        |

            | 400         | INVALID_IDENTIFIER_VA    | Invalid identifier value                                           |

            | 400         | BAD_REQUEST              | Submitted request is malformed/invalid                             |

            | 400         | VALIDATION_ERROR         | This is the "default" error thrown when no others are applicable   |

            | 400         | UNSUPPORTED_VALUE        | There was an unsupported value in the request                      |

            | 400         | NO_ORGANISATION_CONSENT  | Organisation has not provided consent to share data                |

            | 400         | BAD_REQUEST              | Submitted request is malformed/invalid                             |

            | 403         | ACCESS_DENIED            | Access denied                                                      |

            | 404         | NO_RECORD_FOUND          | No record found                                                    |

            '
          content:
            application/fhir+json:
              schema:
                type: object
                description: Link to GPConnect-OperationOutcome-1 resource population guidance [here](https://simplifier.net/guide/gpconnect-data-model/Home/FHIR-Assets/All-assets/Profiles/Profile--GPConnect-OperationOutcome-1?version=current).
              examples:
                example:
                  value:
                    resourceType: OperationOutcome
                    meta:
                      profile:
                      - https://fhir.nhs.uk/STU3/StructureDefinition/GPConnect-OperationOutcome-1
                    issue:
                    - severity: error
                      code: not-found
                      details:
                        coding:
                        - system: https://fhir.nhs.uk/STU3/ValueSet/Spine-ErrorOrWarningCode-1
                          code: NO_RECORD_FOUND
                          display: No record found
      tags:
      - Patient
      operationId: getPatientByIdAppointment
      x-operation-id-source: derived
    servers:
    - description: Sandbox environment.
      url: https://sandbox.api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
    - description: Integration test environment.
      url: https://int.api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
    - description: Production environment.
      url: https://api.service.nhs.uk/gp-connect/patient-facing/appointments-management-fhir/FHIR/STU3/
  /Patient/$gpc.getstructuredrecord:
    post:
      operationId: get-structured-record
      summary: Access a structured record relating to a patient
      description: '## Overview


        This end point returns a patient''s record in structured format using FHIR Operations. It returns a Bundle.


        The request body must be a Parameters resource.


        For administrative purposes, every response must return the following resources within the Bundle:


        * Patient resource matching the NHS Number sent in the body of the request


        * Organization matching the patient''s registered GP practice, referenced from Patient.generalPractitioner


        * Organization matching the organisation serving the request, if different from above, referenced from Patient.managingOrganization


        * Practitioner matching the patient''s usual GP, if they have one, referenced from Patient.generalPractitioner


        * PractitionerRole matching the usual GP''s role'
      parameters:
      - $ref: '#/components/parameters/BearerAuthorization'
      - $ref: '#/components/parameters/CorrelationID'
      - $ref: '#/components/parameters/RequestID_2'
      requestBody:
        required: true
        description: Valid request for the entire record.
        content:
          application/fhir+json:
            schema:
              type: object
              description: 'Request all information that has been recorded for the patient in the last three months. Information on how the parameters resource is populated can be found [here.](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Build/Retrieve-a-patient-s-structured-record.page.md?version=current)

                '
            examples:
              fullRecordRequest:
                value:
                  resourceType: Parameters
                  parameter:
                  - name: patientNHSNumber
                    valueIdentifier:
                      system: https://fhir.nhs.uk/Id/nhs-number
                      value: '9000000009'
                  - name: includeAllergies
                    part:
                    - name: includeResolvedAllergies
                      valueBoolean: true
                  - name: includeConsultations
                    part:
                    - name: consultationSearchPeriod
                      valuePeriod:
                        start: '2019-12-21'
                        end: '2020-02-21'
                  - name: includeProblems
                    part:
                    - name: filterStatus
                      valueCode: active
                    - name: filterSignificance
                      valueCode: major
                  - name: includeImmunizations
                    part:
                    - name: includeNotGiven
                      valueBoolean: true
                    - name: includeStatus
                      valueBoolean: true
                  - name: includeInvestigations
                  - name: includeMedication
              repeatOnlyRequest:
                value:
                  resourceType: Parameters
                  parameter:
                  - name: patientNHSNumber
                    valueIdentifier:
                      system: https://fhir.nhs.uk/Id/nhs-number
                      value: '9999999999'
                  - name: includeMedication
                    part:
                    - name: medicationSearchFromDate
                      valueDate: '2019-02-21'
                    - name: prescriptionType
                      value: repeat
      responses:
        '200':
          description: 'Information surrounding how a patients structured is retrieved can be found [here.](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Build/Retrieve-a-patient-s-structured-record.page.md?version=current)

            Examples of the payload requests and responses can be found here:

            * [Allergies FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Allergies?version=current)

            * [Medications FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Medications?version=current)

            * [Immunizations FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Immunizations?version=current)

            * [Consultations FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Consultations?version=current)

            * [Investigations FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Investigations?version=current)

            * [Combined FHIR examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Multiple-combined?version=current)

            * [Problems examples](https://simplifier.net/guide/GP-Connect-Patient-Facing-Access-Record/Home/Examples/Problems?version=current)

            '
          content:
            application/fhir+json:
              schema:
                type: object
              examples:
                immunizations:
